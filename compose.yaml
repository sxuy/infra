services:
  caddy:
    image: caddy:2.10.0-alpine
    container_name: foxii-caddy
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./routes:/etc/caddy/routes:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ingress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ingress:
    name: foxii-edge
    external: true

volumes:
  caddy-data:
    name: foxii-caddy-data
    external: true
  caddy-config:
    name: foxii-caddy-config
    external: true
